<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NET - Simulation d'architecture</title>
<style>
  :root { --g:#00ff00; --dim:#0a7a0a; --bg:#0a0a0a; --red:#ff3344; --amb:#ffb000; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--g); font-family:'Courier New',Courier,monospace; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:2px solid var(--g); }
  header h1 { font-size:1.1em; margin:0; }
  button { font:inherit; color:var(--g); background:#111; border:1px solid var(--g); padding:8px 14px; cursor:pointer; }
  button:hover, button:focus-visible { background:var(--g); color:#000; outline:none; }
  main { max-width:900px; margin:0 auto; padding:24px; }
  .strate { border:1px solid var(--g); margin-bottom:22px; box-shadow:0 0 15px rgba(0,255,0,.15); animation:in .4s; }
  @keyframes in { from { opacity:0; } to { opacity:1; } }
  .strate h2 { margin:0; padding:10px 14px; background:#222; font-size:1em; border-bottom:1px solid var(--g); }
  .nodes { padding:10px; display:grid; gap:8px; }
  .node { display:flex; justify-content:space-between; gap:12px; text-align:left; width:100%; padding:12px; border-left:3px solid var(--dim); }
  .node small { color:var(--dim); display:block; margin-top:3px; }
  .node:hover small, .node:focus-visible small { color:#000; }
  .done { border-left-color:var(--g); }
  .tag { white-space:nowrap; font-size:.85em; }
  .tag.off { color:var(--red); } .tag.on { color:var(--g); }
  .node:hover .tag, .node:focus-visible .tag { color:#000; }
  .locked { color:var(--dim); padding:14px; border:1px dashed var(--dim); text-align:center; }
  #panel { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; padding:20px; z-index:5; }
  #panel.open { display:flex; }
  .box { background:#0f0f0f; border:2px solid var(--g); width:min(640px,100%); max-height:90vh; overflow:auto; padding:22px; box-shadow:0 0 25px rgba(0,255,0,.3); }
  .box h3 { margin-top:0; }
  .box img { max-width:100%; display:block; margin:14px 0; border:1px solid var(--g); background:#000; }
  .box .txt { white-space:pre-wrap; line-height:1.6; margin:14px 0; }
  .box a { color:var(--amb); }
  .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .box.wide { width:min(1000px,100%); }
  .hl { background:var(--amb); color:#000; font-weight:bold; padding:3px 6px; box-shadow:0 0 12px rgba(255,176,0,.6); }
  .tw { overflow-x:auto; margin:14px 0; }
  table { border-collapse:collapse; width:100%; font-size:.88em; }
  th, td { border:1px solid var(--dim); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#222; }
  td:nth-child(1), td:nth-child(4) { white-space:nowrap; }
  td:nth-child(4) { text-align:right; }
  tr.in td:nth-child(4) { color:var(--g); } tr.out td:nth-child(4) { color:var(--red); }
  .warn { color:var(--red); }
  @media (prefers-reduced-motion:reduce) { .strate { animation:none; } }
</style>
</head>

const LABEL = { password:"MOT DE PASSE", cameras:"NŒUD DE CONTRÔLE", tourelles:"NŒUD DE CONTRÔLE",
                blackice:"PROGRAMME BLACK ICE", fichier:"FICHIER", paydata:"FICHIER PAYDATA" };

/* ===== ÉTAT ===== */
let state;
function reset(){ state = { max:1, cracked:{}, opened:{}, revealed:{}, won:{}, tourelles:true }; render(); }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  STRATES.forEach((s,i)=>{
    const n = i+1;
    if (n > state.max) return;
    const sec = document.createElement('section');
    sec.className = 'strate';
    sec.innerHTML = `<h2>> ${s.nom}</h2>`;
    const list = document.createElement('div'); list.className = 'nodes';
    s.nodes.forEach(nd=>{
      const b = document.createElement('button');
      b.className = 'node' + (state.cracked[nd.id] || state.opened[nd.id] ? ' done' : '');
      if (!state.revealed[nd.id]) {
        b.innerHTML = '<span>[ ??? ] Donnée non identifiée<small>Cliquer pour analyser</small></span>';
        b.onclick = ()=>openNode(nd);
        list.appendChild(b);
        return;
      }
      let tag = '';
      if (nd.type==='password' || nd.type==='cameras') tag = state.cracked[nd.id] ? '<span class="tag on">ACCÈS OBTENU</span>' : '<span class="tag off">VERROUILLÉ</span>';
      if (nd.type==='blackice') tag = state.won[nd.id] ? '<span class="tag on">NEUTRALISÉE</span>' : '<span class="tag off">HOSTILE</span>';
      if (nd.type==='tourelles') tag = !state.cracked[nd.id] ? '<span class="tag off">VERROUILLÉ</span>' : state.tourelles ? '<span class="tag off">ACTIVÉ</span>' : '<span class="tag on">DÉSACTIVÉ</span>';
      b.innerHTML = `<span>[${LABEL[nd.type]}] ${nd.nom}<small>${[nd.diff && 'Difficulté : '+nd.diff, nd.sous].filter(Boolean).join(' - ')}</small></span>${tag}`;
      b.onclick = ()=>openNode(nd);
      list.appendChild(b);
    });
    sec.appendChild(list);
    app.appendChild(sec);
  });
  if (state.max < STRATES.length) {
    const l = document.createElement('div');
    l.className = 'locked';
    l.textContent = '> STRATE ' + (state.max+1) + ' : ACCÈS VERROUILLÉ';
    app.appendChild(l);
  }
}

/* ===== PANNEAU ===== */
function show(html, wide){ const b = document.getElementById('box'); b.innerHTML = html; b.classList.toggle('wide', !!wide); document.getElementById('panel').classList.add('open'); }
let lockP = false;
function closeP(){ if (lockP) return; document.getElementById('panel').classList.remove('open'); }
function endFight(win){
  lockP = false;
  if (win) { state.won['ice'] = true; render(); }
  closeP();
}
const closeBtn = '<button onclick="closeP()">Fermer</button>';

function openNode(nd){
  if (!state.revealed[nd.id]) { state.revealed[nd.id] = true; render(); }
  const head = `<h3>[${LABEL[nd.type]}] ${nd.nom}</h3>` + (nd.diff ? `<p>Difficulté : ${nd.diff}</p>` : '');
  if (nd.type==='password') {
    if (state.cracked[nd.id]) return show(head + '<p>Accès déjà obtenu.</p><div class="row">'+closeBtn+'</div>');
    return show(head + `<p>Le mot de passe protège l'accès à la strate ${nd.ouvre}.</p>
      <div class="row"><button onclick="crack('${nd.id}',${nd.ouvre})">Jet réussi (1 action)</button>${closeBtn}</div>`);
  }
  if (nd.type==='cameras' || nd.type==='tourelles') {
    if (!state.cracked[nd.id])
      return show(head + `<p>Le nœud de contrôle est verrouillé.</p>
        <div class="row"><button onclick="access('${nd.id}')">Jet réussi (1 action)</button>${closeBtn}</div>`);
    if (nd.type==='cameras')
      return show(head + `<p>Accès au nœud obtenu. Flux de surveillance disponible.</p>
        <div class="row"><a href="${nd.lien}" target="_blank" rel="noopener"><button>Accéder aux caméras (1 action)</button></a>${closeBtn}</div>`);
    const t = state.tourelles;
    return show(head + `<p>Accès au nœud obtenu. État : <b class="${t?'warn':''}">${t?'ACTIVÉ':'DÉSACTIVÉ'}</b></p>
      <div class="row"><button onclick="toggleT()">${t?'Désactiver':'Activer'} les tourelles (1 action)</button>${closeBtn}</div>`);
  }
  if (nd.type==='blackice') {
    if (state.won[nd.id])
      return show(head + `<p>Glace <b>${nd.nomIA}</b> neutralisée.</p><div class="row">${closeBtn}</div>`);
    lockP = true;
    return show(head + `<img src="${nd.image}" alt="${nd.nomIA}" onerror="this.style.display='none'">
      <p>Nom de Glace : <b>${nd.nomIA}</b> - ${nd.stats}</p><p class="warn">Combat en cours : impossible de quitter sans choisir.</p>
      <div class="row"><button onclick="endFight(false)">Fuir (1 action)</button><button onclick="endFight(true)">Victoire</button></div>`);
  }
  // fichiers
  if (state.opened[nd.id]) return showFile(nd);
  show(head + `<p>Fichier verrouillé : il faut l'analyser pour le lire.</p>
    <div class="row"><button onclick="analyse('${nd.id}')">Analyser (1 action)</button>${closeBtn}</div>`);
}

function findNode(id){ for (const s of STRATES) for (const n of s.nodes) if (n.id===id) return n; }
function showFile(nd){
  let t = `<h3>${nd.titre}</h3><div class="txt">${nd.texte}</div>`;
  if (nd.table) {
    t += '<div class="tw"><table><thead><tr>' + nd.table.cols.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>'
      + nd.table.rows.map(r=>`<tr class="${r[1]==='IN'?'in':'out'}">` + r.map(c=>`<td>${c}</td>`).join('') + '</tr>').join('')
      + '</tbody></table></div><div class="txt">' + (nd.pied||'') + '</div>';
  }
  show(t + `<div class="row">${closeBtn}</div>`, !!nd.table);
}
function analyse(id){
  state.opened[id] = true; render();
  showFile(findNode(id));
}

function crack(id, strate){
  state.cracked[id] = true;
  state.max = Math.max(state.max, strate);
  render();
  show(`<h3>> ACCÈS OBTENU</h3><p>La strate ${strate} est maintenant accessible.</p><div class="row">${closeBtn}</div>`);
}
function access(id){
  state.cracked[id] = true; render();
  openNode(findNode(id));
}
function toggleT(){
  state.tourelles = !state.tourelles; render();
  openNode(findNode('tour'));
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeP(); });
reset();
</script>
</body>
</html>
